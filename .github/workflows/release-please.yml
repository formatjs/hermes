name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: release-tools
          repository-cache: true
      - name: Check upstream version and release pipeline
        run: bazel test --config=linux //tests/version:version_test //tools/release:release_test
      - name: Validate checked-in BCR overlay
        run: bazel run //tools/bcr:validate
      - name: Update release PR and publish approved merged release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: bazel run --config=linux //tools/release:release
