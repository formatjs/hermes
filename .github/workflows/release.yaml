name: Release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
  push:
    tags: ["v*.*.*"]
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: hermes-*.tar.gz
      prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
      tag_name: ${{ inputs.tag_name || github.ref_name }}
  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
