name: Native Smoke Tests
on:
  status:
  workflow_dispatch:
    inputs:
      invocation_url:
        description: Successful BuildBuddy workflow invocation URL
        required: true
        type: string
      commit_sha:
        description: Full commit SHA built by that invocation
        required: true
        type: string
      workspace:
        description: BuildBuddy producer workspace
        required: true
        type: choice
        options: [root, consumer]
permissions:
  contents: read
concurrency:
  group: native-smoke-${{ inputs.workspace || github.event.context }}-${{ inputs.commit_sha || github.event.sha }}
  cancel-in-progress: true
jobs:
  record-status:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == 'buildbuddy-io[bot]' &&
      github.event.state == 'success' &&
      (github.event.context == 'Test all targets' ||
      github.event.context == 'Test independent consumer'))
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    outputs:
      workspace: ${{ steps.identity.outputs.workspace }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: ${{ inputs.commit_sha || github.event.sha }}
      WORKSPACE_NAME: ${{ inputs.workspace || (github.event.context == 'Test all targets' && 'root' || 'consumer') }}
    steps:
      - name: Record native smoke status
        id: identity
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKSPACE_NAME" == root || "$WORKSPACE_NAME" == consumer ]]
          echo "workspace=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$BUILD_SHA" \
            -f state=pending -f context="Native Smoke Tests / $WORKSPACE_NAME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Running BuildBuddy artifact smoke tests'

  download:
    needs: record-status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted artifact downloader
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified BuildBuddy bundle
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url || github.event.target_url }}
          BUILD_SHA: ${{ needs.record-status.outputs.commit_sha }}
          WORKSPACE_NAME: ${{ needs.record-status.outputs.workspace }}
        run: python3 tools/ci/buildbuddy_artifacts.py
      - name: Upload native smoke bundle
        uses: actions/upload-artifact@v7
        with:
          name: hermes-macos-arm64-${{ needs.record-status.outputs.workspace }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  macos-smoke:
    name: macOS ARM64 artifact smoke
    needs: [record-status, download]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download current-run bundle
        uses: actions/download-artifact@v8
        with:
          name: hermes-macos-arm64-${{ needs.record-status.outputs.workspace }}
          path: ${{ runner.temp }}/hermes-smoke
      - name: Verify and run bundle
        env:
          SMOKE_ROOT: ${{ runner.temp }}/hermes-smoke
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          (cd "$SMOKE_ROOT" && shasum -a 256 -c smoke.tar.gz.sha256)
          python3 - "$SMOKE_ROOT/smoke.tar.gz" <<'PY'
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              files = []
              for member in archive.getmembers():
                  name = member.name.removeprefix("./")
                  if member.isdir() and name in ("", "."):
                      continue
                  if not member.isfile() or name not in {"runtime_test", "hermesc"}:
                      raise SystemExit(f"Unexpected archive entry: {member.name}")
                  if member.mode & 0o777 != 0o755:
                      raise SystemExit(f"Unexpected executable mode: {member.name}")
                  files.append(name)
              if sorted(files) != ["hermesc", "runtime_test"]:
                  raise SystemExit("Incomplete smoke bundle")
          PY
          binary_dir="$SMOKE_ROOT/bin"
          mkdir -p "$binary_dir"
          tar -xzf "$SMOKE_ROOT/smoke.tar.gz" -C "$binary_dir"
          for binary in runtime_test hermesc; do
            file "$binary_dir/$binary" | grep -E 'Mach-O 64-bit.*arm64'
          done
          "$binary_dir/runtime_test"
          printf 'print("Hermes compiler smoke");\n' > "$binary_dir/smoke.js"
          "$binary_dir/hermesc" -O -emit-binary "-out=$binary_dir/smoke.hbc" "$binary_dir/smoke.js"
          test -s "$binary_dir/smoke.hbc"

  publish-status:
    needs: [record-status, download, macos-smoke]
    if: always() && !cancelled() && needs.record-status.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: ${{ needs.record-status.outputs.commit_sha }}
      WORKSPACE_NAME: ${{ needs.record-status.outputs.workspace }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Publish native smoke result
        run: |
          state=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<< "$RESULTS")
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$BUILD_SHA" \
            -f state="$state" -f context="Native Smoke Tests / $WORKSPACE_NAME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Native smoke tests: $state"
