name: Publish to BCR
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: hermes-bcr-publication
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      TAG_NAME: ${{ inputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          path: this
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: bazelbuild/bazel-central-registry
          path: registry
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      - name: Create upstream archive entry
        working-directory: this
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" == v* ]]
          version=${TAG_NAME#v}
          bazel run //tools/bcr:entry -- --registry="$GITHUB_WORKSPACE/registry" --version="$version"
          echo "ENTRY=registry/modules/hermes/$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify upstream archive
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          source = json.loads(Path(os.environ["ENTRY"], "source.json").read_text())
          with urllib.request.urlopen(source["url"]) as response:
              archive = response.read()
          integrity = "sha256-" + base64.b64encode(hashlib.sha256(archive).digest()).decode()
          if integrity != source["integrity"]:
              raise SystemExit("Upstream archive checksum mismatch")
          dest = Path(os.environ["RUNNER_TEMP"], source["url"].rsplit("/", 1)[1])
          dest.write_bytes(archive)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"UPSTREAM_ARCHIVE={dest}\n")
          PY
      - name: Attest registry entry
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            ${{ env.ENTRY }}/**/*
            ${{ env.UPSTREAM_ARCHIVE }}
      - name: Upload registry attestations
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -c . "$BUNDLE" > bcr.intoto.jsonl
          gh release upload "$TAG_NAME" bcr.intoto.jsonl --repo "$GITHUB_REPOSITORY" --clobber
          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path

          bundle = Path("bcr.intoto.jsonl").read_bytes()
          evidence = {
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG_NAME']}/bcr.intoto.jsonl",
              "integrity": "sha256-" + base64.b64encode(hashlib.sha256(bundle).digest()).decode(),
          }
          manifest = {
              "mediaType": "application/vnd.build.bazel.registry.attestation+json;version=1.0.0",
              "attestations": {name: evidence for name in ["MODULE.bazel", "source.json", Path(os.environ["UPSTREAM_ARCHIVE"]).name]},
          }
          Path(os.environ["ENTRY"], "attestations.json").write_text(json.dumps(manifest, indent=4) + "\n")
          PY
      - name: Open BCR pull request
        working-directory: registry
        env:
          GH_TOKEN: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          branch="hermes-$TAG_NAME"
          git switch -c "$branch"
          git add "modules/hermes"
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "hermes@$VERSION"
          gh auth setup-git
          fork=https://github.com/formatjs/bazel-central-registry.git
          previous=$(git ls-remote "$fork" "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$previous" "$fork" "$branch"
          printf 'Release: https://github.com/%s/releases/tag/%s\n\nUses pinned upstream Hermes archive with native BCR overlay.\n' "$GITHUB_REPOSITORY" "$TAG_NAME" > "$RUNNER_TEMP/bcr-body.md"
          existing=$(gh pr list --repo bazelbuild/bazel-central-registry --head "formatjs:$branch" --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo bazelbuild/bazel-central-registry --base main --head "formatjs:$branch" --title "hermes@$VERSION" --body-file "$RUNNER_TEMP/bcr-body.md"
          fi
